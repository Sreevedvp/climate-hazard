name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: --health-cmd 'mongosh --quiet --eval "db.adminCommand(\"ping\").ok"' --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run format:check && npm test && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: MONGO_TEST=1 python -m pytest -q
        working-directory: backend
